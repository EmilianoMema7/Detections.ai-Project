title: Non-Browser Process Accessing Browser Credential and Cookie Store Files
id: 6b6e6e2a-6a2b-4b6b-9e6e-1c2d3e4f5a6b
status: experimental
description: Detects a non-browser process reading or accessing Chrome/Edge/Brave 'Login Data', 'Cookies', 'Local State' files or Firefox 'cookies.sqlite'/'logins.json' under user profile paths, consistent with infostealer malware (Vidar, Lumma/LummaC2, StealC, RedLine, Acreed) harvesting saved passwords and session cookies to hijack authenticated sessions and bypass 2FA/SSO, as described in Anthropic's August 2026 Claude account-hijacking advisory.
author: detections.ai
references:
  - https://attack.mitre.org/techniques/T1555/003/
  - https://attack.mitre.org/techniques/T1539/
date: '2026-08-31'
modified: '2026-08-31'
tags:
  - attack.credential-access
  - attack.t1555.003
  - attack.t1539
  - malware.vidar
  - malware.lummac2
  - malware.stealc
  - malware.redline
  - malware.acreed
  - malware.atomicstealer
logsource:
  category: file_event
  product: windows
detection:
  selection_target:
    TargetFilename|contains:
      - '\Google\Chrome\User Data\'
      - '\Microsoft\Edge\User Data\'
      - '\BraveSoftware\Brave-Browser\User Data\'
      - '\Mozilla\Firefox\Profiles\'
    TargetFilename|endswith:
      - '\Login Data'
      - '\Cookies'
      - '\Local State'
      - '\cookies.sqlite'
      - '\logins.json'
  filter_browsers:
    Image|endswith:
      - '\chrome.exe'
      - '\msedge.exe'
      - '\brave.exe'
      - '\firefox.exe'
  filter_avtools:
    Image|endswith:
      - '\MsMpEng.exe'
      - '\SentinelAgent.exe'
      - '\CylanceSvc.exe'
      - '\mbam.exe'
      - '\vsserv.exe'
      - '\wrsa.exe'
      - '\backup.exe'
      - '\NortonSecurity.exe'
      - '\avastui.exe'
      - '\avgui.exe'
  condition: selection_target and not (filter_browsers or filter_avtools)
falsepositives:
  - Backup software indexing browser profile directories
  - Endpoint security agents scanning browser data
  - Browser profile migration or sync utilities
  - Forensic or IT support tools legitimately inspecting browser stores
level: high
