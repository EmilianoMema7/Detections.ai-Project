title: QUICSILVER Persistence via SystemIn.lnk Startup Shortcut
id: 96e303e9-5ea1-4e48-b643-f1f010a19e8a
author: detections.ai
date: '2026-08-28'
modified: '2026-08-28'
tags:
  - attack.persistence
  - attack.t1547.001
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_ps:
    Image|endswith: '\powershell.exe'
    CommandLine|contains: 'create_lnk_'
  selection_content:
    CommandLine|contains:
      - 'WScript.Shell'
      - 'CreateShortcut'
      - 'SystemIn.lnk'
  condition: selection_ps or selection_content
falsepositives:
  - Unlikely; script naming pattern and shortcut target are highly specific
level: high
fields:
  - Image
  - CommandLine
  - ParentImage
  - TargetFilename
