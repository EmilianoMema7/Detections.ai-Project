title: AdaptixC2 Renamed Windows Contacts Utility Launched via WmiPrvSE
id: 6f2a9e3d-8b4c-4a1f-9d7e-2c5f8b1a9d34
status: experimental
description: |
  Detects a renamed copy of the legitimate Windows Contacts/Address Book utility (wab.exe, e.g. renamed to AdgNsy.exe) being spawned with WmiPrvSE.exe as its parent process. Observed in the AdaptixC2 process injection technique used in a Bumblebee/Akira intrusion (The DFIR Report, 2026), where the renamed binary is subsequently injected with a thread whose entry point lies outside its own image, establishing outbound C2.
author: detections.ai
references:
  - internal-report
date: '2026-08-28'
modified: '2026-08-28'
tags:
  - attack.t1055
  - attack.t1036.003
  - attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection_spawn:
    ParentImage|endswith: '\WmiPrvSE.exe'
    OriginalFileName: 'wab.exe'
  filter_expected_name:
    Image|endswith: '\wab.exe'
  condition: selection_spawn and not filter_expected_name
falsepositives:
  - Legitimate administrative scripts or software deployment tools that invoke wab.exe via WMI under its original filename should not trigger the filter branch; investigate any hit where Image and OriginalFileName diverge
level: critical
fields:
  - ParentImage
  - Image
  - OriginalFileName
  - CommandLine
