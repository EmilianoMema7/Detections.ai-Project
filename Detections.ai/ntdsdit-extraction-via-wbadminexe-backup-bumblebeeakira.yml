title: NTDS.dit Extraction via wbadmin.exe Backup
id: 7c1e9a2e-2b6f-4f0a-9d3b-5e6a8f1c4d90
status: experimental
description: Detects use of wbadmin.exe backup functionality to extract Active Directory NTDS.dit database and SYSTEM/SECURITY registry hives for offline credential harvesting, as observed in the Bumblebee/AdaptixC2/Akira ransomware intrusion documented by The DFIR Report (2026). Typically executed over an RDP session on a domain controller.
author: detections.ai
references:
  - https://thedfirreport.com/
date: '2026-08-28'
modified: '2026-08-28'
tags:
  - attack.credential_access
  - attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\wbadmin.exe'
  selection_backup:
    CommandLine|contains: 'start backup'
  selection_ntds:
    CommandLine|contains:
      - 'ntds.dit'
      - 'NTDS\ntds.dit'
  selection_hive:
    CommandLine|contains:
      - 'SYSTEM'
      - 'SECURITY'
  condition: selection_image and selection_backup and selection_ntds and selection_hive
falsepositives:
  - Legitimate scheduled full system state backups performed by backup administrators (rare, verify context and RDP session origin)
level: critical
