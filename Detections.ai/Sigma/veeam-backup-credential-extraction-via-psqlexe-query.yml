title: Veeam Backup & Replication Credentials Extracted via psql.exe
id: 41f3b4db-69cb-4161-a562-fe7e5a1dd5c7
status: experimental
description: Detects use of the psql.exe command-line client to query the Veeam Backup & Replication PostgreSQL database for stored credentials (user_name/password/description columns), as observed in a Bumblebee/AdaptixC2/Akira ransomware intrusion where extracted credentials were later decrypted via DPAPI using a hard-coded salt.
author: detections.ai
references:
  - The DFIR Report, 2026
date: '2026-08-28'
modified: '2026-08-28'
tags:
  - attack.t1555
  - attack.t1003
  - attack.t1140
logsource:
  category: process_creation
  product: windows
detection:
  selection_psql:
    Image|endswith: '\psql.exe'
    CommandLine|contains|all:
      - 'VeeamBackup'
      - 'credentials'
  condition: selection_psql
falsepositives:
  - Legitimate Veeam database administration or troubleshooting by authorized backup administrators
level: high
fields:
  - Image
  - CommandLine
  - ParentImage
  - ParentCommandLine
  - User
