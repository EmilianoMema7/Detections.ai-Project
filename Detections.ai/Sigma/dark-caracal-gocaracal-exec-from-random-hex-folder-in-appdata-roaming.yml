title: Dark Caracal GoCaracal Execution from Randomly-Named AppData Roaming Subfolder
id: 7d2f6f2a-6b3e-4b2b-9a3c-2f5e6d1c9b7a
status: experimental
description: Detects execution of an executable located directly under a hex-like randomly-named subdirectory within %AppData%\Roaming\, matching the GoCaracal drop pattern used by Dark Caracal (observed by Arctic Wolf, Aug 2026), e.g. AppData\Roaming\d30547514515\91ed375e.exe
author: detections.ai
references:
  - Arctic Wolf Dark Caracal GoCaracal reporting, Aug 2026
date: '2026-08-31'
modified: '2026-08-31'
tags:
  - attack.execution
  - attack.t1204.002
  - attack.defense_evasion
  - attack.t1036
  - campaign.dark_caracal
  - campaign.gocaracal
  - campaign.bandook
logsource:
  category: process_creation
  product: windows
detection:
  selection_path:
    Image|contains: '\AppData\Roaming\'
  selection_hex_pattern:
    Image|re: '(?i)\\AppData\\Roaming\\[0-9a-f]{8,16}\\[0-9a-f]{6,16}\.exe$'
  condition: selection_path and selection_hex_pattern
falsepositives:
  - Unlikely; legitimate applications typically install into vendor-named subfolders under Roaming rather than hex-like random directories
level: high
