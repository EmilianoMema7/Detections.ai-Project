title: Registry Query of Chrome/Edge App Paths Key by Non-Browser Process
id: 8f34e270-d499-4417-8426-033cd9f98ef8
author: detections.ai
date: '2026-08-28'
modified: '2026-08-28'
tags:
  - attack.t1012
  - attack.t1082
  - attack.t1518
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    EventType: 'QueryValue'
    TargetObject|endswith:
      - '\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\chrome.exe'
      - '\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\msedge.exe'
  filter_main_browsers:
    Image|endswith:
      - '\chrome.exe'
      - '\msedge.exe'
  condition: selection and not filter_main_browsers
falsepositives:
  - Legitimate installers or shortcut resolvers that query App Paths keys to locate browser executables
  - System management or inventory tools enumerating installed software paths
level: medium
fields:
  - Image
  - TargetObject
  - CommandLine
