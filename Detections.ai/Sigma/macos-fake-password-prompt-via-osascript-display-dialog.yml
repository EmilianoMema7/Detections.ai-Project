title: macOS Fake Native Password Prompt via osascript
id: 8f2b6c1e-4a7d-4e3a-9c2f-1d5e7a9b3c6f
status: experimental
description: Detects use of osascript to display a fake native-looking password prompt requesting the user's password or administrator privileges, a technique used by a macOS stealer analyzed by Huntress to harvest credentials for privilege escalation without repeated prompting.
author: detections.ai
references:
  - Huntress macOS stealer analysis
date: '2026-08-28'
modified: '2026-08-28'
tags:
  - attack.t1056.002
  - attack.t1548.004
logsource:
  category: process_creation
  product: macos
detection:
  selection_osascript:
    Image|endswith: '/usr/bin/osascript'
  selection_dialog:
    CommandLine|contains: 'display dialog'
  selection_lure:
    CommandLine|contains:
      - 'password'
      - 'administrator privileges'
  filter_known_installer:
    ParentImage|contains:
      - '/Applications/'
      - 'Install'
  condition: selection_osascript and selection_dialog and selection_lure and not filter_known_installer
falsepositives:
  - Legitimate installer scripts that use osascript to prompt for admin credentials during signed application installation
level: medium
