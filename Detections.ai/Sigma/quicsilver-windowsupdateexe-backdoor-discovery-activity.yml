  selection_hash:
    Hashes|contains: 'CD147EFE37003399E174951927E5FE727A4481756B116F0204A14A64CC62B059'
  condition: selection_image or selection_hash
falsepositives:
  - Unlikely; this binary name and hash are specific to the QUICSILVER campaign implant
