title: msaRAT MSI Custom Action CA_Run_EA2AEBC3 Loads lib.dll
id: 6d3f2a9e-1c4b-4f6a-9d2e-7b8c5a1e4f30
status: experimental
description: Detects execution of the msaRAT malicious MSI custom action CA_Run_EA2AEBC3, which loads the embedded lib.dll payload from the MSI Binary table (Bin_lib_EA2AEBC3) directly into memory via msiexec.exe at InstallFinalize.
author: detections.ai
references:
  - https://detections.ai/workspace/user/personal/knowledge
date: '2026-08-28'
modified: '2026-08-28'
tags:
  - attack.defense-evasion
  - attack.t1218.007
  - attack.t1027
  - attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  selection_process:
    Image|endswith: '\msiexec.exe'
  selection_indicators:
    CommandLine|contains:
      - 'CA_Run_EA2AEBC3'
      - 'Bin_lib_EA2AEBC3'
      - 'lib.dll'
  condition: selection_process and selection_indicators
falsepositives:
  - Unknown
level: high
