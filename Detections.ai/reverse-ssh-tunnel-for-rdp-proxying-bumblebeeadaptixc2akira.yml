title: Reverse SSH Tunnel Establishment for RDP Proxying
id: 12198f9f-7b27-470b-beab-33c4c93bc2e3
status: experimental
description: Detects execution of ssh.exe with remote port forwarding (-R) flags used to establish a reverse SSH tunnel proxying RDP traffic to an external threat-actor-controlled server, bypassing firewall restrictions. Observed in Bumblebee/AdaptixC2/Akira ransomware intrusions.
author: detections.ai
references:
  - The DFIR Report, 2026
date: '2026-08-28'
modified: '2026-08-28'
tags:
  - attack.t1572
  - attack.t1090
  - attack.t1021.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\ssh.exe'
  selection_flag:
    CommandLine|contains: '-R'
  selection_bind:
    CommandLine|contains:
      - '*:'
      - ' -R '
  selection_dest:
    CommandLine|re: '-R\s+(\*:)?\d+'
  condition: selection_image and selection_flag and selection_bind and selection_dest
falsepositives:
  - Legitimate administrative use of SSH remote port forwarding for approved remote access
level: high
